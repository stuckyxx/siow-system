# Sincronização agendada (o Vercel Cron do plano Hobby roda no máximo 1x/dia; vercel.json fica como reserva):
# chama o endpoint de sincronização a cada 20 minutos (cada chamada processa as fontes mais antigas
# dentro de SYNC_BUDGET_MS) + integrações; verificações diárias e cobrança da plataforma às 09:00 UTC.
# Segredos necessários no repositório: APP_URL (ex.: https://app.exemplo.com.br) e CRON_SECRET
# (mesmo valor da variável CRON_SECRET do projeto na Vercel).
name: Sync cron

on:
  schedule:
    - cron: '*/20 * * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  sync:
    if: github.event.schedule != '0 9 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar fontes de dados
        run: |
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/sync"
      - name: Integrações (webhooks pendentes e assinaturas)
        run: |
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/integracoes"

  daily:
    if: github.event.schedule == '0 9 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Verificações diárias
        run: |
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/daily"
      - name: Plataforma (faturas de assinatura e bloqueio suave)
        run: |
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/platform"
