# Netlify — Base directory do projeto = apps/web (monorepo pnpm; o install roda na raiz automaticamente).
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS   = "--no-frozen-lockfile"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  directory    = "netlify/functions"

# Sincronização automática: a cada 20 min, ~2 entidades por execução (limite de 10 s por função
# no plano Free → as 41 entidades são atualizadas ao longo do dia). Verificações diárias às 09:00 UTC.
[functions."scheduled-sync"]
  schedule = "*/20 * * * *"
[functions."scheduled-daily"]
  schedule = "0 9 * * *"
